name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/cmdline-tools
            ~/android-sdk/platforms
            ~/android-sdk/build-tools
          key: ${{ runner.os }}-android-sdk-34
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install Android SDK command line tools
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Accept licenses & install SDK components
        run: |
          export ANDROID_HOME=~/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Show directory structure
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f -name "*.kt" | head -20
          echo ""
          echo "=== Assets ==="
          ls -la app/src/main/assets/doors/ | head -5

      - name: Build debug APK
        run: |
          export ANDROID_HOME=~/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
        env:
          JAVA_OPTS: -Xmx4096m

      - name: Check build output
        run: |
          echo "=== Build output ==="
          find . -name "*.apk" 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK dir not found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoorMatcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload TFLite model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tflite-model
          path: app/src/main/assets/models/

      - name: Summary
        run: |
          echo "## 🚪 DoorMatcher Build"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ **APK built successfully!**"
            echo "- Size: $(du -sh app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            echo "- Path: \`app/build/outputs/apk/debug/app-debug.apk\`"
          else
            echo "❌ **Build failed** - no APK found"
            echo "Check build logs above for errors"
            exit 1
          fi
